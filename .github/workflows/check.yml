name: Check
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container: mirror.gcr.io/library/dart:stable
    steps:
      - name: Install make, git, and Python
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends make git python3 >/dev/null
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Prove the image has no Node
        run: |
          if command -v node >/dev/null; then
            echo "node is on PATH; the core must build and test without it"
            exit 1
          fi
      - name: Resolve dependencies
        run: make setup/deps
      - name: Check formatting and analysis
        run: make check/format check/lint
      - name: Test
        run: make test
      - name: Run the CLI against recorded fixtures
        run: make test/cli
      - name: Score the package like pub.dev
        run: make check/pana/flighthouse
      - name: Validate the package for publishing
        run: make check/publish
  flutter:
    name: Flutter companion package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Analyze the companion package
        run: make check/flutter
      - name: Score the companion package like pub.dev
        run: make check/pana/flutter
