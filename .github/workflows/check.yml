name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - name: Cache the pub cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dart-3.13.5-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-3.13.5-
      - name: Remove Node from the runner
        run: |
          while node_path="$(command -v node)"; do
            sudo rm -f "$node_path"
            hash -r
            if [ -e "$node_path" ]; then
              echo "could not remove $node_path"
              exit 1
            fi
          done
      - name: Prove the runner has no Node
        run: |
          if command -v node >/dev/null; then
            echo "node is on PATH; the core must build and test without it"
            exit 1
          fi
      - name: Decide whether to score the package
        id: pana
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "$changed"
          if grep -qE '^(pubspec\.yaml|README\.md|CHANGELOG\.md|LICENSE|Makefile|\.github/workflows/check\.yml|example/|lib/)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve dependencies
        run: make setup/deps
      - name: Check formatting and analysis
        run: make check/format check/lint
      - name: Test with line coverage of lib/ against the floor
        run: make check/coverage
      - name: Publish the line coverage summary
        if: always()
        run: |
          if [ -f coverage/summary.md ]; then
            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run the CLI against recorded fixtures
        run: make test/cli
      - name: Score the package like pub.dev
        if: steps.pana.outputs.run == 'true'
        run: make check/pana/flighthouse
      - name: Validate the package for publishing
        run: make check/publish
  flutter:
    name: Flutter companion package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Decide whether to score the companion package
        id: pana
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "$changed"
          if grep -qE '^(packages/flighthouse_flutter/(pubspec\.yaml|README\.md|CHANGELOG\.md|LICENSE|example/|lib/)|Makefile|\.github/workflows/check\.yml)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Analyze the companion package
        run: make check/flutter
      - name: Test the companion package
        run: make test/flutter
      - name: Score the companion package like pub.dev
        if: steps.pana.outputs.run == 'true'
        run: make check/pana/flutter
