name: Bug Report
description: File a bug report.
title: "[Bug] "
labels: ["bug"]
type: Bug
assignees: []
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also, what did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: flighthouse version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tool versions
      description: Dart SDK, and the versions of any tool whose output was ingested (attest, Lighthouse, axe, ...).
  - type: textarea
    id: input
    attributes:
      label: Raw input that reproduces it
      description: The raw tool output or config, trimmed to the smallest file that still reproduces it.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: CLI output
      render: shell
